# Builds the feature bundle the app downloads, and logs the consensus
# projections that the backtest cannot otherwise compare against.
#
# NOTE: scheduled workflows only fire from the repository's DEFAULT branch.
# Until this file is merged there, the crons below do nothing and the workflow
# has to be started by hand from the Actions tab.
name: Weekly feature bundle

on:
  schedule:
    # Tue-Sat 11:00 UTC (~06:00 ET): Tuesday picks up the previous week's stats
    # once nflverse posts them, Wednesday to Friday the practice reports.
    - cron: "0 11 * * 2,3,4,5,6"
    # Sunday 15:00 UTC (11:00 ET): the run that matters, roughly 90 minutes
    # before the 13:00 ET kickoff wave, when inactives are final.
    - cron: "0 15 * * 0"
    # Monday 15:00 UTC: ahead of the Monday night game.
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = whatever Sleeper says is current)"
        required: false
      week:
        description: "Week to build (blank = current)"
        required: false

permissions:
  contents: write

# Runs push to the same branch, so never let two overlap.
concurrency:
  group: weekly-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      # Completed seasons are ~40MB and never change, so they are worth caching.
      # The key rotates every run so each run saves a fresh copy; restore-keys
      # means it still starts from the most recent one.
      - name: Restore nflverse history
        uses: actions/cache@v4
        with:
          path: model/data
          key: nflverse-history-v1-${{ github.run_id }}
          restore-keys: nflverse-history-v1-

      - name: Drop anything that changes mid-season
        working-directory: model
        run: python3 -c "from nflpredict.ingest import purge_live; purge_live()"

      - name: Build the weekly bundle
        id: bundle
        working-directory: model
        env:
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          args=""
          if [ -n "$SEASON" ]; then args="$args --season $SEASON"; fi
          if [ -n "$WEEK" ]; then args="$args --week $WEEK"; fi

          set +e
          python3 build_week.py $args
          code=$?
          set -e

          # 78 is build_week's "there is no week to build" exit, which is the
          # normal state from February to August. Skip the rest, stay green.
          if [ "$code" -eq 78 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Out of season or no scheduled games - nothing to build"
            exit 0
          fi
          exit "$code"

      - name: Log consensus projections
        if: steps.bundle.outputs.skip != 'true'
        working-directory: model
        # Best effort: this only feeds the eventual "do we beat consensus?"
        # comparison, so a Sleeper hiccup must not fail the bundle.
        continue-on-error: true
        env:
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          args=""
          if [ -n "$SEASON" ]; then args="$args --season $SEASON"; fi
          if [ -n "$WEEK" ]; then args="$args --week $WEEK"; fi
          python3 collect_projections.py $args

      - name: Commit and push
        if: steps.bundle.outputs.skip != 'true'
        run: |
          summary=$(python3 - <<'PY'
          import gzip, json
          bundle = json.load(gzip.open("model/artifacts/week.json.gz"))
          print(f"{bundle['season']} week {bundle['week']}, "
                f"{len(bundle['players'])} players")
          PY
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/artifacts/week.json.gz model/data/consensus_projections.csv

          if git diff --staged --quiet; then
            echo "::notice::Bundle unchanged since the last run"
            exit 0
          fi

          git commit -m "Weekly bundle: $summary" -m "Generated by the weekly-bundle workflow."

          # The branch may have moved since checkout; rebase rather than clobber.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload bundle as an artifact
        if: steps.bundle.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: week-bundle
          path: model/artifacts/week.json.gz
          retention-days: 30
