# Runs the unit tests. Worth having because the model's Kotlin port is only
# trustworthy if ModelParityTest keeps passing against whatever model.json.gz is
# committed, and the Compose/Hilt/WorkManager code has no other coverage.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 to match app/build.gradle.kts, not the newest available: AGP
      # pins the toolchain and a mismatch fails at configuration time.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages: ''` is load-bearing. The action's default is
      # "tools platform-tools", and `tools` was removed from the SDK years ago,
      # so sdkmanager exits 1 with "Failed to find package 'tools'" before any
      # Gradle work starts. The runner image already ships the SDK; all this
      # step needs to do is export ANDROID_HOME.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''


      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      # Compiling is not the same as packaging. Resource and manifest merging,
      # asset packaging and dexing all happen here and nowhere else, so without
      # this step the first time anyone finds out whether an APK can be produced
      # is when they try to produce one.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Means every push leaves a debug APK that can be downloaded and side-loaded
      # straight onto a phone, with no local Android Studio needed.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sit-or-play-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # The reports say which assertion failed; the console output alone often
      # does not for parameterised cases.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements.txt
      - run: pip install -r model/requirements.txt

      # No network fixtures here, so this checks that the pipeline imports and
      # that the committed bundle still lines up with the committed model --
      # the mismatch the app refuses to score, caught before it ships.
      - name: Check the bundle matches the model
        run: python3 model/check_artifacts.py
